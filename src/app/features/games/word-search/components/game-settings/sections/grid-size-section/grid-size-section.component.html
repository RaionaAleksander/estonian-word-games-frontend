<app-search-section title="Grid Size">
  <app-section-row>
    <app-section-field label="Rows">
      <input
        type="number"
        [value]="rows"
        (input)="onRowsChange($any($event.target).value)"
        class="w-full box-border px-3 py-2 border border-gray-300 rounded-md bg-white font-inherit"
      />
    </app-section-field>

    <app-section-field label="Columns">
      <input
        type="number"
        [value]="cols"
        (input)="onColsChange($any($event.target).value)"
        class="w-full box-border px-3 py-2 border border-gray-300 rounded-md bg-white font-inherit"
      />
    </app-section-field>
  </app-section-row>
</app-search-section>
