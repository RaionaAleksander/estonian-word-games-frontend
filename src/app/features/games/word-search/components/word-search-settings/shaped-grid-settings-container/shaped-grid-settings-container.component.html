<section class="game-settings-container">
  <app-collapsible-header
    title="Grid Settings"
    [isExpanded]="isExpanded()"
    (expandedChange)="toggle()"
  />

  @if (isExpanded()) {
    <app-grid-size-section
      [rows]="settings.rows"
      [cols]="settings.cols"
      (valueChange)="updateSettings($event)"
    />

    <app-blocked-cells-section
      [blockedCells]="settings.blockedCells"
      [rows]="settings.rows"
      [cols]="settings.cols"
      (valueChange)="updateSettings($event)"
    />
  }
</section>
