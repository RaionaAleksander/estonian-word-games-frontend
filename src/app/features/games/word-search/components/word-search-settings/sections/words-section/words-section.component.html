<app-search-section>
  <app-section-row>
    <app-section-field label="Words" [required]="true">
      <input
        id="words"
        type="text"
        placeholder="apple, banana, orange"
        [value]="words.join(', ')"
        (input)="onChange($event)"
        class="w-full box-border rounded-md border border-gray-300 bg-white px-3 py-2 font-inherit"
      />
    </app-section-field>
  </app-section-row>
</app-search-section>
