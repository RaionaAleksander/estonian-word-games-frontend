<app-search-section>
  <app-section-row>
    <app-section-field label="Fill Alphabet">
      <select
        [value]="fillAlphabet"
        (change)="onFillAlphabetChange($any($event.target).value)"
        class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-gray-300"
      >
        <option value="ESTONIAN">Estonian</option>
        <option value="ENGLISH">English</option>
        <option value="RUSSIAN">Russian</option>
      </select>
    </app-section-field>
  </app-section-row>
</app-search-section>
