<app-search-section title="Word Placement">
  <app-section-row>
    <app-section-field label="Allow word intersections">
      <label class="flex items-center gap-3">
        <input
          type="checkbox"
          [checked]="allowIntersections"
          (change)="onChange($any($event.target).checked)"
        />
      </label>
    </app-section-field>
  </app-section-row>
</app-search-section>
