<div class="mt-6 flex justify-center">
  <div class="w-full max-w-3xl rounded-lg border border-gray-200 bg-white p-4">
    <h2 class="mb-3 text-center text-xl font-semibold">
      Words
    </h2>

    <div class="flex flex-wrap justify-center gap-2">
      @for (word of words; track wordIndex; let wordIndex = $index) {
        <span class="rounded bg-gray-100 px-3 py-1 text-sm">
          {{ word }}
        </span>
      }
    </div>
  </div>
</div>
