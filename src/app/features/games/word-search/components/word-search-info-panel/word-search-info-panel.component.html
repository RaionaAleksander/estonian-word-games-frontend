<div class="mt-6 rounded-lg border border-gray-200 bg-white p-4">
  <div class="grid gap-4 text-center md:grid-cols-3">
    <div>
      <div class="text-sm text-gray-500">
        Grid Size
      </div>

      <div class="text-lg font-semibold">
        {{ rows }} × {{ cols }}
      </div>
    </div>

    <div>
      <div class="text-sm text-gray-500">
        Words
      </div>

      <div class="text-lg font-semibold">
        {{ wordsCount }}
      </div>
    </div>

    <div>
      <div class="text-sm text-gray-500">
        Game Type
      </div>

      <div class="text-lg font-semibold">
        {{ gameType }}
      </div>
    </div>
  </div>
</div>
