<div class="mt-8 flex justify-center overflow-x-auto">
  <div class="inline-block rounded-lg border border-gray-300 bg-white p-4">
    <div
      class="grid gap-1"
      [style.gridTemplateColumns]="'repeat(' + cols + ', 32px)'"
    >
      @for (row of rows; track rowIndex; let rowIndex = $index) {
        @for (cell of row; track cellIndex; let cellIndex = $index) {
          <div class="flex h-8 w-8 items-center justify-center rounded border border-gray-200 font-mono text-sm">
            {{ cell }}
          </div>
        }
      }
    </div>
  </div>
</div>
