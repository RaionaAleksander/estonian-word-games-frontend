<section class="mx-auto max-w-6xl p-8">

  <h1 class="mb-6 text-3xl font-bold">
    Sõnasegadik
  </h1>

  <!-- MAIN PANEL -->
  <app-word-search-main-panel
    [settings]="query.settings"
    [filters]="query.filters"
    [sort]="query.sort"
    (applyAllEvent)="onQueryChange($event)"
    (resetAllEvent)="onReset()"
  />

  <!-- LOADING -->
  @if (loading()) {
    <app-loading-state [message]="'Generating word search...'" />
  }

  <!-- ERROR -->
  @if (error()) {
    <app-error-state [error]="error()!" />
  }

  <!-- RESULT -->
  @else if (response(); as res) {
    <app-word-search-grid
      [rows]="gridRows()"
      [cols]="res.cols"
      [zoom]="zoom()"
      (selectionEnd)="onSelection($event)"
      [foundCells]="foundCells()"
      [previewCells]="previewCells()"
    />

    <app-word-search-side-panel>
      <app-word-search-words
        [words]="res.words"
        [foundWords]="foundWords()"
        (hoverWord)="previewWord($event)"
        (leaveWord)="clearPreview()"
      />

      <app-word-search-victory
        [isVisible]="isCompleted()"
      />

      <app-word-search-controls
        (clean)="clearGameProgress()"
        (zoomIn)="onZoomIn()"
        (zoomOut)="onZoomOut()"
        [canZoomIn]="canZoomIn()"
        [canZoomOut]="canZoomOut()"
      />
    </app-word-search-side-panel>

    <app-word-search-info-panel
      [rows]="res.rows"
      [cols]="res.cols"
      [wordsCount]="res.words.length"
      [gameType]="res.gameType"
    />

    <app-query-meta-panel
      [generatedAt]="res.generatedAt"
    >
      <app-filter-meta
        [filters]="res.meta.filters"
      />
      <app-sort-meta
        [sort]="res.meta.sort"
      />
    </app-query-meta-panel>
  }

  <!-- EMPTY -->
  @else {
    <app-empty-state
      title="No game generated"
      description="Configure settings and click Generate to create a word search."
    />
  }

</section>
