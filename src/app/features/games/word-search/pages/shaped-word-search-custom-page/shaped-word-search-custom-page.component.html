<section class="mx-auto max-w-6xl p-8">
  <!-- Breadcrumb -->
  <app-breadcrumbs
    [items]="[
      { label: 'Home', route: '/' },
      { label: 'Games', route: '/games' },
      { label: 'Custom Shaped Word Search' }
    ]"
  />

  <h1 class="mb-6 text-3xl font-bold">
    Custom Shaped Word Search
  </h1>

  <!-- MAIN PANEL -->
  <app-custom-shaped-word-search-main-panel
    [settings]="query.settings"
    [sort]="query.sort"
    (applyAllEvent)="onQueryChange($event)"
    (resetAllEvent)="onReset()"
  />

  <!-- LOADING -->
  @if (loading()) {
    <app-loading-state
      [message]="'Generating custom shaped word search...'"
    />
  }

  <!-- ERROR -->
  @if (error()) {
    <app-error-state
      [error]="error()!"
    />
  }

  <!-- RESULT -->
  @else if (response(); as res) {
    <app-word-search-game
      [response]="res"
    />

    <app-word-search-info-panel
      [response]="res"
    />

    <app-word-search-export
      [response]="res"
    />

    <app-query-meta-panel
      [generatedAt]="res.generatedAt"
    >
      <app-sort-meta
        [sort]="res.meta.sort"
      />
    </app-query-meta-panel>
  }

  <!-- EMPTY -->
  @else {
    <app-empty-state
      title="No game generated"
      description="Enter your words and click Generate to create a custom shaped word search."
    />
  }
</section>
