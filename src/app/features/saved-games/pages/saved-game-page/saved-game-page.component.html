<section class="mx-auto max-w-6xl p-8">
  <h1 class="mb-4 flex items-center gap-2 text-3xl font-bold">
    <a
      routerLink="/saved-games"
      class="text-gray-600 transition-colors duration-200 hover:text-blue-800"
    >
      Saved Games
    </a>

    <span class="text-gray-400">
      /
    </span>

    <span>
      Game #{{ gameId }}
    </span>
  </h1>

  <hr class="border-0 border-t border-gray-200">

  @if (loading()) {
    <app-loading-state
      message="Loading saved game..."
    />
  }

  @if (error()) {
    <app-error-state
      [error]="error()!"
    />
  }

  @else if (response(); as res) {
    <app-saved-game-view
      [response]="res"
    />
  }
</section>
