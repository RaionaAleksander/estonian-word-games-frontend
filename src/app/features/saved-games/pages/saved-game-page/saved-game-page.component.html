<section class="mx-auto max-w-6xl p-8">
  <!-- Breadcrumb -->
  <app-breadcrumbs
    [items]="[
      { label: 'Home', route: '/' },
      { label: 'Games', route: '/games' },
      { label: 'Saved Games', route: '/saved-games' },
      { label: 'Game #' + gameId }
    ]"
  />

  <h1 class="mb-4 text-3xl font-bold">
    Game #{{ gameId }}
  </h1>

  <hr class="border-0 border-t border-gray-200">

  @if (loading()) {
    <app-loading-state
      message="Loading saved game..."
    />
  }

  @if (error()) {
    <app-error-state
      [error]="error()!"
    />
  }

  @else if (response(); as res) {
    <app-saved-game-view
      [response]="res"
    />
  }
</section>
