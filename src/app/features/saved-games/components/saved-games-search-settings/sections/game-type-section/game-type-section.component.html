<app-search-section>
  <app-section-row>
    <app-section-field label="Game type">
      <select
        [value]="gameType ?? ''"
        (change)="onGameTypeChange($any($event.target).value)"
        class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-gray-300"
      >
        <option value="">All games</option>
        <option value="FIND_WORD">Find Word</option>
        <option value="WORD_SEARCH">Word Search</option>
        <option value="CUSTOM_WORD_SEARCH">Custom Word Search</option>
      </select>
    </app-section-field>
  </app-section-row>
</app-search-section>
