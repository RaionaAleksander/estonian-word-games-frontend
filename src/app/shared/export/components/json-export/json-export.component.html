<p class="my-4 text-sm text-gray-600">
  Export this game as a JSON or TXT file.
</p>

<div class="bg-gray-900 text-green-200 p-3 rounded-md text-xs overflow-auto max-h-64 border font-mono leading-relaxed whitespace-pre">
  {{ jsonPreview() }}
</div>

<div class="mt-4 flex gap-2">
  <button
    class="flex-1 px-4 py-2 bg-gray-900 text-white rounded-md hover:bg-gray-800 transition"
    (click)="downloadJson()"
  >
    Download JSON
  </button>

  <button
    class="flex-1 px-4 py-2 bg-gray-700 text-white rounded-md hover:bg-gray-600 transition"
    (click)="downloadTxt()"
  >
    Download TXT
  </button>
</div>
