<div class="shadow-sm hover:shadow-md transition border border-gray-200 rounded-md bg-white">
  <!-- HEADER -->
  <div
    class="flex items-center justify-between cursor-pointer select-none px-3 py-2 bg-gray-50 hover:bg-gray-100 transition"
    (click)="toggle()"
  >
    <h3 class="text-base font-medium text-gray-700">
      {{ title }}
    </h3>

    <span
      class="text-gray-500 transition-transform duration-300"
      [class.rotate-90]="isExpanded()"
    >
      ►
    </span>
  </div>

  <!-- CONTENT -->
  @if (isExpanded()) {
    <div class="p-3 border-t border-gray-200">
      <ng-content />
    </div>
  }
</div>
