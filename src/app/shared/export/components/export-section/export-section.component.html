<div
  class="flex items-center justify-between cursor-pointer select-none my-2 group"
  (click)="toggle()"
>
  <h3 class="text-base font-medium text-gray-600 group-hover:text-gray-700 transition-colors">
    {{ title }}
  </h3>

  <span
    class="text-gray-600 transition-transform duration-500"
    [class.rotate-90]="isExpanded()"
  >
    ►
  </span>
</div>

@if (isExpanded()) {
  <ng-content />
}
