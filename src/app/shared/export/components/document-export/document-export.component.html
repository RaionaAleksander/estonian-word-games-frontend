<p class="my-4 text-sm text-gray-600">
  Preview your printable document before exporting it.
</p>

<p class="my-4 text-sm text-gray-600">
  Customize the title, then download the document as PDF or PNG.
</p>

<div class="mb-4">
  <label
    for="document-title"
    class="mb-1 block text-sm font-medium text-gray-700"
  >
    Document title
  </label>

  <input
    id="document-title"
    type="text"
    class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-gray-900 focus:outline-none"
    [value]="documentTitle()"
    (input)="onDocumentTitleInput($event)"
    placeholder="Sõnasegadik"
  />
</div>

<app-document-preview>
  <div #document>
    <app-word-search-document
      [response]="data()"
      [documentTitle]="documentTitle().trim() || 'Sõnasegadik'"
    />
  </div>
</app-document-preview>

<div class="mt-4 flex gap-2">
  <button
    class="flex-1 rounded-md bg-gray-900 px-4 py-2 text-white transition hover:bg-gray-800"
    (click)="downloadPdf()"
  >
    Download PDF
  </button>

  <button
    class="flex-1 rounded-md border border-gray-900 px-4 py-2 transition hover:bg-gray-100"
    (click)="downloadPng()"
  >
    Download PNG
  </button>
</div>
