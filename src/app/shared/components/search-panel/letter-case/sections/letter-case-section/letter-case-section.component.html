<app-search-section>
  <app-section-row>
    <app-section-field label="Letter Case">
      <select
        [value]="letterCase ?? ''"
        (change)="onLetterCaseChange($any($event.target).value)"
        class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-gray-300"
      >
        <option value="">-</option>
        <option value="LOWER">Lower</option>
        <option value="UPPER">Upper</option>
      </select>
    </app-section-field>
  </app-section-row>
</app-search-section>
