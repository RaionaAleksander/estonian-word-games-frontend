<div class="flex h-full flex-col rounded-xl border border-gray-200 bg-white p-6 shadow-sm transition hover:-translate-y-1 hover:shadow-md duration-200">
  @if (imageUrl) {
    <img
      [src]="imageUrl"
      [alt]="title"
      class="mx-auto h-40 object-contain"
    />
  }

  <h2 class="mt-4 text-center text-2xl font-semibold">
    {{ title }}
  </h2>

  @if (description) {
    <p class="flex-1 mt-3 text-center text-gray-600">
      {{ description }}
    </p>
  }

  <div class="mt-5 text-center">
    <button
      [routerLink]="route"
      class="rounded-md bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700 transition-colors duration-200"
    >
      {{ buttonLabel }}
    </button>
  </div>
</div>
