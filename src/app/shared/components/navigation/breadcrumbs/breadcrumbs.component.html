<nav class="mb-4 text-sm text-gray-500">
  @for (item of items(); track item.label; let last = $last) {
    @if (!last && item.route) {
      <a
        [routerLink]="item.route"
        class="hover:underline"
      >
        {{ item.label }}
      </a>

      <span class="mx-2">
        /
      </span>
    } @else {
      <span class="font-medium text-gray-700">
        {{ item.label }}
      </span>
    }
  }
</nav>
